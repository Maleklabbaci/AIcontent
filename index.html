    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // In some iframe/browser environments, window.fetch only has a getter on Window.prototype.
      // If an injected script, proxy, or polyfill assigns to window.fetch, it throws.
      // By defining a setter, we ensure assignments to window.fetch succeed seamlessly.
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHolder;
            },
            set: function(newFetch) {
              fetchHolder = newFetch;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return fetchHolder;
                },
                set: function(newFetch) {
                  fetchHolder = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>
